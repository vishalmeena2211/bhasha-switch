<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1f36"/><stop offset="1" stop-color="#243055"/></linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- faint script marks -->
  <g fill="#ffffff" opacity="0.04" font-size="30">
    <text x="60" y="80">अ</text><text x="420" y="60">அ</text><text x="780" y="90">অ</text><text x="1180" y="70">అ</text><text x="1500" y="110">ಅ</text><text x="1800" y="60">അ</text>
    <text x="1700" y="580">ਅ</text><text x="1040" y="590">ଅ</text><text x="300" y="590">ا</text>
  </g>
  <!-- title -->
  <text x="120" y="150" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-2">bhasha-switch</text>
  <text x="124" y="208" font-size="34" fill="#ffffff" opacity="0.85">One script tag. Your page reads in Hindi, Tamil, Bengali and 20 more Indian languages.</text>

  <!-- the same UI line, three languages -->
  <!-- English -->
  <g transform="translate(120,260)">
