  <g transform="translate(1280,260)">
    <rect width="520" height="280" rx="16" fill="#ffffff"/>
    <rect x="24" y="24" width="210" height="40" rx="10" fill="#ffffff" stroke="#e2e5ea"/>
    <circle cx="48" cy="44" r="8" fill="none" stroke="#2563eb" stroke-width="2"/>
