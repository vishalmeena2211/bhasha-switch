    <text x="66" y="49" font-size="16" fill="#1a1f36">हिन्दी — Hindi</text>
    <text x="212" y="50" font-size="16" fill="#2563eb">▾</text>
    <line x1="24" y1="118" x2="496" y2="118" stroke="#1a1f36" stroke-width="2"/>
    <text x="24" y="156" font-size="22" font-weight="700" fill="#1a1f36">बकाया राशि</text>
