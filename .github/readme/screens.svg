    <text x="536" y="526" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">₹7,320.00</text>
    <line x1="20" y1="546" x2="552" y2="546" stroke="#e6e8ec"/>
    <rect x="36" y="566" width="140" height="30" rx="7" fill="#2563eb"/><text x="106" y="585" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">பணம் வசூலிக்கவும்</text>
    <rect x="186" y="566" width="146" height="30" rx="7" fill="#f0f1f3"/><text x="259" y="585" font-size="11" font-weight="600" fill="#1a1f36" text-anchor="middle">கட்டணம் சேர்க்கவும்</text>
    <rect x="36" y="606" width="96" height="30" rx="7" fill="#f0f1f3"/><text x="84" y="625" font-size="11" font-weight="600" fill="#1a1f36" text-anchor="middle">பாருங்கள்</text>
    <rect x="142" y="606" width="180" height="30" rx="7" fill="#f0f1f3"/><text x="232" y="625" font-size="11" font-weight="600" fill="#1a1f36" text-anchor="middle">விலைப்பட்டியலை அச்சிடுக</text>
    <!-- the dropdown, open -->
