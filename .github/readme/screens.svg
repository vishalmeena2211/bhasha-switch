    <circle cx="390" cy="26" r="7" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M 383 26 h 14 M 390 19 c 2.6 2.3 2.6 11.7 0 14 M 390 19 c -2.6 2.3 -2.6 11.7 0 14" fill="none" stroke="#2563eb" stroke-width="1.4"/>
    <text x="406" y="31" font-size="13" fill="#1a1f36">தமிழ் — Tamil</text>
    <text x="538" y="31" font-size="13" fill="#2563eb">▴</text>
    <rect x="372" y="48" width="184" height="246" rx="10" fill="#ffffff" stroke="#e2e5ea"/>
    <g font-size="13" fill="#1a1f36">
      <text x="386" y="70">English</text>
      <text x="386" y="96">हिन्दी — Hindi</text>
      <text x="386" y="122">বাংলা — Bengali</text>
      <text x="386" y="148">తెలుగు — Telugu</text>
      <text x="386" y="174">मराठी — Marathi</text>
      <rect x="376" y="184" width="176" height="24" rx="6" fill="#2563eb"/>
      <text x="386" y="200" fill="#ffffff">தமிழ் — Tamil</text>
      <text x="386" y="226">ગુજરાતી — Gujarati</text>
      <text x="386" y="252">ಕನ್ನಡ — Kannada</text>
      <text x="386" y="278" fill="#6b7280">15 more…</text>
    </g>
    <!-- caption -->
    <text x="20" y="690" font-size="14" font-weight="700" fill="#1a1f36">The same page after picking தமிழ். What changed:</text>
    <rect x="20" y="706" width="532" height="124" rx="10" fill="#1a1f36"/>
    <g font-family="SF Mono, Menlo, Monaco, Courier New, monospace" font-size="12" fill="#e2e5ea" >
      <text x="36" y="732">localStorage.bhasha_lang = "ta"</text>
      <text x="36" y="754">document.cookie: googtrans = /en/ta</text>
      <text x="36" y="776">document.documentElement.lang = "ta"</text>
      <text x="36" y="798">.goog-te-banner-frame { display: none }</text>
      <text x="36" y="820">body { top: 0; position: static }</text>
    </g>
    <text x="20" y="866" font-size="13" fill="#6b7280">Numbers and amounts stay as they were. Google's banner never shows.</text>
  </g>

  <!-- panel 3: custom engine with a glossary, Hindi -->
  <g transform="translate(1244,40)">
    <rect width="572" height="914" rx="14" fill="#f7f7fb" stroke="#e2e5ea"/>
    <rect width="572" height="44" rx="14" fill="#ffffff"/><rect y="22" width="572" height="22" fill="#ffffff"/>
    <line x1="0" y1="44" x2="572" y2="44" stroke="#e2e5ea"/>
    <text x="20" y="29" font-size="15" font-weight="700" fill="#1a1f36">होटल <tspan fill="#2563eb">प्रॉपर्टी</tspan> डैशबोर्ड</text>
    <rect x="372" y="10" width="184" height="32" rx="10" fill="#ffffff" stroke="#e2e5ea"/>
    <circle cx="390" cy="26" r="7" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M 383 26 h 14 M 390 19 c 2.6 2.3 2.6 11.7 0 14 M 390 19 c -2.6 2.3 -2.6 11.7 0 14" fill="none" stroke="#2563eb" stroke-width="1.4"/>
    <text x="406" y="31" font-size="13" fill="#1a1f36">हिन्दी — Hindi</text>
    <text x="538" y="31" font-size="13" fill="#2563eb">▾</text>
    <rect x="20" y="64" width="532" height="470" rx="12" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="36" y="96" font-size="13" fill="#1a1f36">इस महीने का <tspan fill="#2563eb" font-weight="700">प्रॉपर्टी</tspan> प्रदर्शन। रूम 101 के लिए <tspan fill="#2563eb" font-weight="700">चेक-इन</tspan> लंबित है।</text>
    <text x="36" y="116" font-size="10.5" fill="#2563eb">glossary: Property and Check-in use the approved renderings, the engine never saw them</text>
    <text x="36" y="150" font-size="13" fill="#1a1f36"><tspan fill="#2563eb" font-weight="700">GST</tspan> इनवॉइस कुल और <tspan fill="#2563eb" font-weight="700">UPI</tspan> सेटलमेंट नीचे दिखाए गए हैं।</text>
    <text x="36" y="170" font-size="10.5" fill="#2563eb">doNotTranslate: sent as «0» and «1», put back as they were</text>
    <rect x="36" y="190" width="300" height="34" rx="8" fill="#ffffff" stroke="#e2e5ea"/>
    <text x="48" y="212" font-size="12" fill="#6b7280">अतिथि के नाम से बुकिंग खोजें</text>
    <text x="36" y="244" font-size="10.5" fill="#2563eb">placeholder, title, aria-label and alt are translated too</text>
    <g font-size="12" fill="#1a1f36">
      <text x="36" y="282" fill="#6b7280">आइटम</text><text x="536" y="282" fill="#6b7280" text-anchor="end">राशि</text>
      <line x1="36" y1="290" x2="536" y2="290" stroke="#eef0f4"/>
      <text x="36" y="312">कमरे का शुल्क</text><text x="536" y="312" text-anchor="end">₹9,000.00</text>
      <line x1="36" y1="320" x2="536" y2="320" stroke="#eef0f4"/>
      <text x="36" y="342">भोजन ऑर्डर</text><text x="536" y="342" text-anchor="end">₹1,250.00</text>
      <line x1="36" y1="350" x2="536" y2="350" stroke="#eef0f4"/>
      <text x="36" y="372" font-weight="700">कुल देय</text><text x="536" y="372" font-weight="700" text-anchor="end">₹10,250.00</text>
    </g>
    <text x="36" y="396" font-size="10.5" fill="#2563eb">₹10,250.00 has no two Latin letters in a row: never sent</text>
    <rect x="36" y="420" width="500" height="36" rx="8" fill="#f7f7fb"/>
    <text x="48" y="443" font-size="12" fill="#1a1f36">Guest: Ramesh Kumar (never translated — PII)</text>
    <text x="36" y="480" font-size="10.5" fill="#2563eb">data-bhasha-skip: the guest's name stays on the page</text>
    <text x="36" y="516" font-size="11" fill="#6b7280">Pick English again and every original comes back, byte for byte.</text>
    <!-- the init call, from demo-custom.html -->
    <text x="20" y="574" font-size="14" font-weight="700" fill="#1a1f36">The init() behind it:</text>
    <rect x="20" y="590" width="532" height="256" rx="10" fill="#1a1f36"/>
    <g font-family="SF Mono, Menlo, Monaco, Courier New, monospace" font-size="12" fill="#e2e5ea" >
      <text x="36" y="616">BhashaSwitch.init({</text>
      <text x="50" y="638">engine: 'custom',</text>
      <text x="50" y="660">translateUrl: '/api/translate',</text>
      <text x="50" y="682">glossary: {</text>
      <text x="65" y="704">doNotTranslate: ['GST', 'UPI'],</text>
      <text x="65" y="726">terms: {</text>
      <text x="79" y="748">'Property': { hi: 'प्रॉपर्टी', ta: 'ப்ராபர்ட்டி' },</text>
      <text x="79" y="770">'Check-in': { hi: 'चेक-इन', ta: 'செக்-இன்' }</text>
      <text x="65" y="792">}</text>
      <text x="50" y="814">}</text>
      <text x="36" y="836">});</text>
    </g>
    <text x="20" y="880" font-size="13" fill="#6b7280">examples/sarvam-server.js answers /translate with sarvam-translate:v1.</text>
  </g>
</svg>
